name: ecole_gestion_prof_mobile
description: Application Prof mobile locale Android/iOS pour ECOLE GESTION PRO.
publish_to: 'none'
version: 0.6.1+9

environment:
  sdk: '>=3.9.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.6.0
  shared_preferences: ^2.5.5
  mobile_scanner: ^7.4.2
  uuid: ^4.6.0
  permission_handler: ^13.0.2
  device_info_plus: ^11.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/plume_gravure.png

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/plume_gravure.png"
  adaptive_icon_background: "#E9DFCF"
  adaptive_icon_foreground: "assets/plume_gravure.png"
